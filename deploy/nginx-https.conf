server {
    listen 80;
    server_name formulario.jipdev.cloud;
    location /.well-known/acme-challenge/ { root /var/www/formulario-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name formulario.jipdev.cloud;
    ssl_certificate /etc/letsencrypt/live/formulario.jipdev.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formulario.jipdev.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
